[project]
name = "agent-playground"
version = "0.1.0"
description = "A from-scratch AI Agent system in Python: Function Calling / ReAct, tool registry, SSE streaming, context compaction, asyncio concurrency, and a zero-cost test suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "tzdata>=2026.5",
]

[project.scripts]
agent-playground = "agent_playground:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Markdown 里的 Python 代码块是手写对齐的文档示例，不希望被格式化器重排。
# `*.md` 是 gitignore 语义，覆盖根目录（README.md）和各子目录（docs/）
extend-exclude = ["*.md"]
# 默认情况下，显式指定文件路径（ruff format README.md）会绕过上面这条排除。
# 打开 force-exclude 后，排除规则对显式路径同样生效。
force-exclude = true
